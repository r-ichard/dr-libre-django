_version = 1

[workflow]
graph = "workflow.fabro"

# Smoke test only: keeps fabro/run/* branches off GitHub. Drop this in workflows that open pull requests.
[run.run_branch]
push = false

# The default sandbox image has no Node.js, which the ACP adapter needs.
[run.environment.image]
docker = "node:22-bookworm"

# Claude subscription login for Claude Code inside the sandbox.
# Create the token with `claude setup-token`, store it with `fabro secret set CLAUDE_CODE_OAUTH_TOKEN`.
[run.environment.env]
CLAUDE_CODE_OAUTH_TOKEN = "{{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"
