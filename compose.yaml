services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env.example
    environment:
      DEBUG: "true"
      DB_HOST: db
      EMAIL_HOST: mail
      EMAIL_PORT: "25"
      ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  db:
    image: postgres:15.20-bookworm
    environment:
      POSTGRES_DB: drlibre
      POSTGRES_USER: drlibre
      POSTGRES_PASSWORD: drlibre-development
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drlibre -d drlibre"]
      interval: 5s
      timeout: 3s
      retries: 10

  mail:
    image: rnwood/smtp4dev:3.16.1
    ports:
      - "127.0.0.1:5000:80"

volumes:
  database:
