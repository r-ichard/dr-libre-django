x-application-environment: &application-environment
  DEBUG: "true"
  DB_HOST: db
  EMAIL_HOST: mail
  EMAIL_PORT: "25"
  ALLOWED_HOSTS: localhost,127.0.0.1

services:
  web:
    build: .
    image: drlibre-app
    command: sh -c "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"
    env_file: .env.example
    environment: *application-environment
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  worker:
    image: drlibre-app
    command: python manage.py run_worker
    env_file: .env.example
    environment: *application-environment
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      mail:
        condition: service_started

  db:
    image: postgres:15.20-bookworm
    env_file: .env.example
    entrypoint:
      - sh
      - -c
      - >-
        POSTGRES_DB="$$DB_NAME" POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD"
        exec docker-entrypoint.sh postgres
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 3s
      retries: 10

  mail:
    image: rnwood/smtp4dev:3.16.1
    ports:
      - "127.0.0.1:8025:80"

volumes:
  database:
