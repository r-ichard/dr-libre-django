{% comment %}Parameters: name, label, checked, hint.{% endcomment %}
<div class="checkbox">
  <input class="checkbox__box" type="checkbox" id="id_{{ name }}" name="{{ name }}"{% if checked %} checked{% endif %}{% if hint %} aria-describedby="id_{{ name }}_hint"{% endif %}>
  <label for="id_{{ name }}">{{ label }}</label>
  {% if hint %}<p class="field__hint" id="id_{{ name }}_hint">{{ hint }}</p>{% endif %}
</div>
