{% comment %}Parameters: switch (label, href, current), optional label for the landmark. Links, not tabs, so it works without a script. The current one shows by style and aria-current.{% endcomment %}
<nav class="list-switch" aria-label="{{ label|default:'Kind of result' }}">
  <ul>
    {% for item in switch %}<li><a class="list-switch__link{% if item.current %} list-switch__link--current{% endif %}" href="{{ item.href }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}</a></li>{% endfor %}
  </ul>
</nav>
