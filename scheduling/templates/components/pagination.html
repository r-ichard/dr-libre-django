{% comment %}Parameters: page, page_count, previous_href, next_href. A missing href shows a disabled step.{% endcomment %}
<nav class="pagination" aria-label="Pagination">
  {% if previous_href %}<a class="button button--secondary" href="{{ previous_href }}" rel="prev">Previous</a>{% else %}<span class="button button--secondary" aria-disabled="true">Previous</span>{% endif %}
  <p class="pagination__position">Page {{ page }} of {{ page_count }}</p>
  {% if next_href %}<a class="button button--secondary" href="{{ next_href }}" rel="next">Next</a>{% else %}<span class="button button--secondary" aria-disabled="true">Next</span>{% endif %}
</nav>
